name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 action runtime
      with:
        node-version: 26.12.1
    - name: Build frontend into muscriptor/web_dist
      run: |
        npm install --global pnpm@10.20.0
        pnpm install --frozen-lockfile
        pnpm run build
      working-directory: web
    - name: Build wheels
      run: uv build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    
